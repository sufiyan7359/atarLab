<div class="auth-page">
  <h1>Forgot Password</h1>
  <p class="auth-subtitle">We'll email you a link to reset it</p>

  @if (sent()) {
    <p class="form-success">If an account exists for that email, a reset link has been sent.</p>
  } @else {
    <form (submit)="$event.preventDefault(); submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send Reset Link' }}
      </button>
    </form>
  }

  <p class="auth-footer"><a routerLink="/auth/login">Back to Sign In</a></p>
</div>
