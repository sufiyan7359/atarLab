<div class="page-head">
  <h1>Banners</h1>
  <button type="button" class="btn btn-primary" (click)="startCreate()">+ New Banner</button>
</div>

@if (showForm()) {
  <form class="card-surface admin-form" style="margin-bottom: var(--space-6)" (submit)="$event.preventDefault(); save()">
    <div class="field">
      <label>Title</label>
      <input type="text" [(ngModel)]="form.title" name="title" />
    </div>
    <div class="field">
      <label>Position</label>
      <select [(ngModel)]="form.position" name="position">
        <option value="HERO">Hero</option>
        <option value="STRIP">Strip</option>
        <option value="POPUP">Popup</option>
        <option value="CATEGORY">Category</option>
      </select>
    </div>
    <div class="field field-full">
      <label>Link URL</label>
      <input type="text" [(ngModel)]="form.linkUrl" name="linkUrl" />
    </div>
    <div class="field field-full">
      <label>Image</label>
      @if (form.imageUrl) {
        <img [src]="form.imageUrl" alt="" style="max-width: 240px; border-radius: 8px; margin-bottom: 8px;" />
      }
      <input type="file" accept="image/*" (change)="onFileSelected($event)" [disabled]="uploading()" />
      @if (uploading()) {
        <small>Uploading…</small>
      }
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-ghost" (click)="showForm.set(false)">Cancel</button>
    </div>
  </form>
}

<div class="table-wrap">
  <table class="admin-table">
    <thead>
      <tr><th>Preview</th><th>Title</th><th>Position</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
      @for (banner of banners(); track banner.id) {
        <tr>
          <td><img [src]="banner.imageUrl" alt="" style="width: 64px; height: 36px; object-fit: cover; border-radius: 4px;" /></td>
          <td>{{ banner.title || '—' }}</td>
          <td>{{ banner.position }}</td>
          <td><span class="badge-pill" [class.on]="banner.isActive" [class.off]="!banner.isActive">{{ banner.isActive ? 'Active' : 'Inactive' }}</span></td>
          <td class="actions">
            <button type="button" class="link-btn" (click)="startEdit(banner)">Edit</button>
            <button type="button" class="link-btn danger" (click)="remove(banner.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
