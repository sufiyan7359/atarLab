<div class="page-head">
  <h1>Roles & Permissions</h1>
  <button type="button" class="btn btn-primary" (click)="startCreate()">+ New Role</button>
</div>

@if (showForm()) {
  <form class="card-surface" style="margin-bottom: var(--space-6); max-width: 640px;" (submit)="$event.preventDefault(); save()">
    <div class="field">
      <label>Role Name</label>
      <input type="text" required [(ngModel)]="name" name="name" />
    </div>
    <div class="field">
      <label>Description</label>
      <input type="text" [(ngModel)]="description" name="description" />
    </div>
    <div class="field">
      <label>Permissions</label>
      <div class="permission-grid">
        @for (permission of permissions(); track permission.id) {
          <label class="permission-item">
            <input
              type="checkbox"
              [checked]="selectedPermissionIds.has(permission.id)"
              (change)="togglePermission(permission.id)"
            />
            {{ permission.name }}
          </label>
        }
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Role</button>
      <button type="button" class="btn btn-ghost" (click)="showForm.set(false)">Cancel</button>
    </div>
  </form>
}

<div class="table-wrap">
  <table class="admin-table">
    <thead><tr><th>Role</th><th>Description</th><th>Permissions</th><th></th></tr></thead>
    <tbody>
      @for (role of roles(); track role.id) {
        <tr>
          <td><strong>{{ role.name }}</strong></td>
          <td>{{ role.description || '—' }}</td>
          <td>{{ role.permissions.length }}</td>
          <td class="actions">
            <button type="button" class="link-btn" (click)="startEdit(role)">Edit</button>
            <button type="button" class="link-btn danger" (click)="remove(role.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
