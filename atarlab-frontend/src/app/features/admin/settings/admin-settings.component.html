<div class="page-head">
  <h1>Settings</h1>
</div>

@if (form) {
  <form class="card-surface admin-form" (submit)="$event.preventDefault(); save()">
    <div class="field">
      <label>Store Name</label>
      <input type="text" [(ngModel)]="form.storeName" name="storeName" />
    </div>
    <div class="field">
      <label>Support Email</label>
      <input type="email" [(ngModel)]="form.supportEmail" name="supportEmail" />
    </div>
    <div class="field">
      <label>Tax Rate (%)</label>
      <input type="number" min="0" max="100" [(ngModel)]="form.taxRatePercent" name="taxRatePercent" />
    </div>
    <div class="field">
      <label>Free Shipping Threshold (₹)</label>
      <input type="number" min="0" [(ngModel)]="form.freeShippingThreshold" name="freeShippingThreshold" />
    </div>
    <div class="field">
      <label>Flat Shipping Fee (₹)</label>
      <input type="number" min="0" [(ngModel)]="form.flatShippingFee" name="flatShippingFee" />
    </div>
    <div class="field checkbox-row">
      <label><input type="checkbox" [(ngModel)]="form.codEnabled" name="codEnabled" /> Cash on Delivery Enabled</label>
      <label><input type="checkbox" [(ngModel)]="form.razorpayEnabled" name="razorpayEnabled" /> Razorpay Enabled</label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : 'Save Settings' }}
      </button>
    </div>
  </form>
}
