<div class="page-head">
  <h1>Delivery Agents</h1>
  <button type="button" class="btn btn-primary" (click)="startCreate()">+ New Agent</button>
</div>

@if (showForm()) {
  <form class="card-surface admin-form" style="margin-bottom: var(--space-6)" (submit)="$event.preventDefault(); save()">
    <div class="field">
      <label>Name</label>
      <input type="text" [(ngModel)]="form.name" name="name" required />
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="text" [(ngModel)]="form.phone" name="phone" required />
    </div>
    <div class="field">
      <label>Vehicle Number</label>
      <input type="text" [(ngModel)]="form.vehicleNumber" name="vehicleNumber" />
    </div>
    <div class="field checkbox-row">
      <label><input type="checkbox" [(ngModel)]="form.isActive" name="isActive" /> Active</label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-ghost" (click)="showForm.set(false)">Cancel</button>
    </div>
  </form>
}

<div class="table-wrap">
  <table class="admin-table">
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
      @for (agent of agents(); track agent.id) {
        <tr>
          <td>{{ agent.name }}</td>
          <td>{{ agent.phone }}</td>
          <td>{{ agent.vehicleNumber ?? '—' }}</td>
          <td><span class="badge-pill" [class.on]="agent.isActive" [class.off]="!agent.isActive">{{ agent.isActive ? 'Active' : 'Inactive' }}</span></td>
          <td class="actions">
            <button type="button" class="link-btn" (click)="startEdit(agent)">Edit</button>
            <button type="button" class="link-btn" [class.danger]="agent.isActive" (click)="toggleActive(agent)">
              {{ agent.isActive ? 'Deactivate' : 'Activate' }}
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
