<div class="page-head">
  <h1>Categories</h1>
  <button type="button" class="btn btn-primary" (click)="startCreate()">+ New Category</button>
</div>

@if (showForm()) {
  <form class="card-surface admin-form" style="margin-bottom: var(--space-6)" (submit)="$event.preventDefault(); save()">
    <div class="field">
      <label>Name</label>
      <input type="text" required [(ngModel)]="form.name" name="name" />
    </div>
    <div class="field">
      <label>Slug</label>
      <input type="text" required [(ngModel)]="form.slug" name="slug" />
    </div>
    <div class="field field-full">
      <label>Image URL</label>
      <input type="text" [(ngModel)]="form.imageUrl" name="imageUrl" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-ghost" (click)="showForm.set(false)">Cancel</button>
    </div>
  </form>
}

<div class="table-wrap">
  <table class="admin-table">
    <thead>
      <tr><th>Name</th><th>Slug</th><th>Subcategories</th><th></th></tr>
    </thead>
    <tbody>
      @for (category of categories(); track category.id) {
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.slug }}</td>
          <td>{{ category.children?.length ?? 0 }}</td>
          <td class="actions">
            <button type="button" class="link-btn" (click)="startEdit(category)">Edit</button>
            <button type="button" class="link-btn danger" (click)="remove(category.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
