<div class="page-head">
  <h1>Offers</h1>
  <button type="button" class="btn btn-primary" (click)="startCreate()">+ New Offer</button>
</div>

@if (showForm()) {
  <form class="card-surface admin-form" style="margin-bottom: var(--space-6)" (submit)="$event.preventDefault(); save()">
    <div class="field field-full">
      <label>Title</label>
      <input type="text" required [(ngModel)]="form.title" name="title" />
    </div>
    <div class="field">
      <label>Discount Type</label>
      <select [(ngModel)]="form.discountType" name="discountType">
        <option value="PERCENTAGE">Percentage</option>
        <option value="FIXED">Fixed Amount</option>
      </select>
    </div>
    <div class="field">
      <label>Discount Value</label>
      <input type="number" required min="0" [(ngModel)]="form.discountValue" name="discountValue" />
    </div>
    <div class="field">
      <label>Category (optional)</label>
      <select [(ngModel)]="form.categoryId" name="categoryId">
        <option [ngValue]="null">— None —</option>
        @for (c of categories(); track c.id) {
          <option [ngValue]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label>Brand (optional)</label>
      <select [(ngModel)]="form.brandId" name="brandId">
        <option [ngValue]="null">— None —</option>
        @for (b of brands(); track b.id) {
          <option [ngValue]="b.id">{{ b.name }}</option>
        }
      </select>
    </div>
    <div class="field field-full">
      <label>Description</label>
      <input type="text" [(ngModel)]="form.description" name="description" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-ghost" (click)="showForm.set(false)">Cancel</button>
    </div>
  </form>
}

<div class="table-wrap">
  <table class="admin-table">
    <thead>
      <tr><th>Title</th><th>Discount</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
      @for (offer of offers(); track offer.id) {
        <tr>
          <td data-label="Title">{{ offer.title }}</td>
          <td data-label="Discount">{{ offer.discountType === 'PERCENTAGE' ? offer.discountValue + '%' : ('₹' + offer.discountValue) }}</td>
          <td data-label="Status"><span class="badge-pill" [class.on]="offer.isActive" [class.off]="!offer.isActive">{{ offer.isActive ? 'Active' : 'Inactive' }}</span></td>
          <td class="actions">
            <button type="button" class="link-btn" (click)="startEdit(offer)">Edit</button>
            <button type="button" class="link-btn danger" (click)="remove(offer.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
