<div class="page-head">
  <h1>Activity Logs</h1>
</div>

@if (loading()) {
  <p>Loading activity…</p>
} @else {
  <div class="table-wrap">
    <table class="admin-table">
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>IP</th></tr></thead>
      <tbody>
        @for (log of logs(); track log.id) {
          <tr>
            <td data-label="When">{{ log.createdAt | date: 'medium' }}</td>
            <td data-label="Actor">{{ log.actor?.fullName ?? 'System' }}</td>
            <td data-label="Action">{{ log.action }}</td>
            <td data-label="Entity">{{ log.entityType }}</td>
            <td data-label="IP">{{ log.ip ?? '—' }}</td>
          </tr>
        } @empty {
          <tr><td colspan="5">No activity recorded yet.</td></tr>
        }
      </tbody>
    </table>
  </div>
}
