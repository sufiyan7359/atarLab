# Render Blueprint for AtarLab.
#
# Topology: two separate web services (no reverse proxy), each on its own
# *.onrender.com origin, plus one managed Postgres database:
#   - atarlab7359-backend   NestJS API             (Docker, docker/Dockerfile)
#   - atarlab7359-frontend  Angular SSR storefront (Docker, docker/Dockerfile)
#   - atarlab7359-db        Postgres
#
# Service names are suffixed (7359) because Render service names are global across
# all Render users, not just your account — the plain "atarlab-frontend" was already
# taken by someone else, Render silently suffixed it instead (atarlab-frontend-qump),
# and every hardcoded URL below pointed at the wrong host until it was caught. Even
# "atarlab7359-frontend" then got suffixed again on recreate (atarlab7359-frontend-k12v),
# which broke CORS the same way (backend's CORS_ORIGIN/FRONTEND_URL still pointed at
# the un-suffixed name, so the browser's real Origin never matched, and every
# register/login request was rejected by the browser as a CORS failure). Fixed for
# good below: CORS_ORIGIN/FRONTEND_URL now use `fromService.envVarKey: RENDER_EXTERNAL_URL`
# to read the frontend's actual assigned URL at deploy time instead of a hardcoded guess.
#
# Because the two services are on different origins, COOKIE_SAME_SITE is set to
# 'none' below (see auth.controller.ts) so the refresh-token cookie survives the
# cross-site request, and the frontend's environment.prod.ts bakes in the backend's
# absolute URL at build time instead of a relative '/api/v1'. That one *does* still
# need a manual update if the backend service is ever renamed (self-healing only works
# one direction — a Render web service can read another service's assigned host, but
# environment.prod.ts is compiled into the frontend's static build, before Render has
# assigned anything):
#   - atarlab-frontend/src/environments/environment.prod.ts (apiUrl)
#   - GOOGLE_CALLBACK_URL / BACKEND_PUBLIC_URL below (both reference the backend's own host)
# (NG_ALLOWED_HOSTS needs no such update either — server.ts derives it at boot from
# Render's own RENDER_EXTERNAL_HOSTNAME, whatever hostname actually got assigned.)
#
# Redis isn't provisioned here: it's configured (REDIS_HOST/PORT) but nothing in
# the codebase actually connects to it yet — it's reserved for post-MVP caching/
# BullMQ/Socket.IO scaling work. Add a `keyvalue` service when that lands.
#
# Migrations run automatically on every backend boot (docker/Dockerfile's CMD runs
# `npm run migration:run:prod` before starting the server — a no-op once applied).
# Not wired as Render's preDeployCommand since that requires a paid plan.
#
# One-time manual steps after the first deploy (Render Shell, on atarlab7359-backend):
#   npm run seed          — creates the admin user + sample catalog
# And note: file uploads fall back to local disk when CLOUDINARY_* is blank, and
# Render's disk is ephemeral per-deploy — configure Cloudinary before relying on
# real product image uploads in production.

databases:
  - name: atarlab7359-db
    databaseName: atarlab
    user: atarlab
    plan: free

services:
  - type: web
    name: atarlab7359-backend
    runtime: docker
    dockerfilePath: atarlab-backend/docker/Dockerfile
    dockerContext: atarlab-backend
    plan: free
    healthCheckPath: /health
    # Free-tier services can't use preDeployCommand, so migrations run as part of the
    # container's start command instead — see docker/Dockerfile's CMD.
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        fromService: { name: atarlab7359-frontend, type: web, envVarKey: RENDER_EXTERNAL_URL }
      - key: COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_URL
        fromService: { name: atarlab7359-frontend, type: web, envVarKey: RENDER_EXTERNAL_URL }
      - key: BACKEND_PUBLIC_URL
        value: https://atarlab7359-backend.onrender.com

      - key: DB_HOST
        fromDatabase: { name: atarlab7359-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: atarlab7359-db, property: port }
      - key: DB_USERNAME
        fromDatabase: { name: atarlab7359-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: atarlab7359-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: atarlab7359-db, property: database }
      - key: DB_SSL
        value: "true"

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Optional integrations — blank means the app's built-in sandbox fallbacks kick in
      # (console-logged mail, no-op Razorpay orders, local-disk uploads, inert Google
      # OAuth, inert Sentry). Fill in via the Render dashboard once real credentials
      # exist; none of this needs a code or redeploy change.
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_CALLBACK_URL
        value: https://atarlab7359-backend.onrender.com/api/v1/auth/google/callback
      - key: MAIL_HOST
        value: ""
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USER
        value: ""
      - key: MAIL_PASSWORD
        value: ""
      - key: MAIL_FROM
        value: "AtarLab <no-reply@atarlab.com>"
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: SENTRY_DSN
        value: ""

  - type: web
    name: atarlab7359-frontend
    runtime: docker
    dockerfilePath: atarlab-frontend/docker/Dockerfile
    dockerContext: atarlab-frontend
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # No NG_ALLOWED_HOSTS here: Render suffixes the service name if it's taken (it did:
      # atarlab-frontend-qump.onrender.com), so a static value would be wrong on arrival.
      # server.ts instead folds Render's own RENDER_EXTERNAL_HOSTNAME into the allowlist
      # at boot, whatever hostname Render actually assigned.
